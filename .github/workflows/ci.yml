name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The workflow only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Unit tests
        run: python -m pytest -q

  docker:
    name: Docker build and compose check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches dependency conflicts and Dockerfile mistakes before they reach your VPS.
      - name: Build the API image
        run: docker build -t saathi-api ./services/api

      # Validates docker-compose.yml using the example settings (no secrets involved).
      # The mkdir is a stand-in so validation passes before the dashboard exists (phase 5).
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          mkdir -p services/dashboard
          docker compose config --quiet
